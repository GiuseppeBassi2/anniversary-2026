<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3efe8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="A private anniversary story for Min.">
    <title>Anniversary 2026</title>
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <main class="experience" data-tone="default" aria-label="Anniversary story">
      <header class="experience__header">
        <p class="eyebrow" id="scene-context">Anniversary 2026</p>
        <p class="progress__label" id="progress-label" aria-live="off"></p>
        <div class="progress" aria-hidden="true"><span class="progress__bar" id="progress-bar"></span></div>
      </header>

      <section class="stage" id="stage" aria-live="polite" aria-atomic="true"></section>

      <nav class="controls" aria-label="Story navigation">
        <button class="control" id="previous-scene" type="button" aria-label="Previous scene">←</button>
        <button class="control" id="next-scene" type="button" aria-label="Next scene">→</button>
      </nav>
    </main>

    <noscript>This anniversary story needs JavaScript to move between scenes.</noscript>
  </body>
</html>
