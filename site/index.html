<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3efe8">
    <meta name="description" content="A private anniversary story for Min.">
    <title>Anniversary 2026</title>
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <main class="experience" aria-label="Anniversary story">
      <header class="experience__header">
        <p class="eyebrow" id="scene-context">Anniversary 2026</p>
        <div class="progress" aria-label="Story progress">
          <span class="progress__bar" id="progress-bar"></span>
        </div>
        <p class="progress__label" id="progress-label" aria-live="polite"></p>
      </header>

      <section class="stage" id="stage" aria-live="polite" aria-atomic="true"></section>

      <nav class="controls" aria-label="Story navigation">
        <button class="control control--back" id="previous-scene" type="button" aria-label="Previous scene">
          <span aria-hidden="true">←</span>
          <span>Back</span>
        </button>
        <p class="tap-hint" id="tap-hint">Tap the story to continue</p>
        <button class="control control--next" id="next-scene" type="button" aria-label="Next scene">
          <span>Next</span>
          <span aria-hidden="true">→</span>
        </button>
      </nav>
    </main>

    <noscript>This anniversary story needs JavaScript to move between scenes.</noscript>
  </body>
</html>
